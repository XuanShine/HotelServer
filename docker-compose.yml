services:
  webserver:
    build: .
    ports:
      - "8301:8301"
    volumes:
      - server_data:/app/databases
      - server_data:/app/apps/HotelRates/logs
    environment:
      - DATABASE_URL=sqlite://storage.db
      - DATABASE_FOLDER=/app/databases
      - HOTELRATES_LOG_FOLDER=/app/apps/HotelRates/logs
      - LOG_LEVEL=DEBUG
      - ENVIRONEMENT=dev
      - TZ=Europe/Paris
    command: python -m py4web run apps --host 0.0.0.0 --port 8301

  checkinflet:
    build: checkinFlet/
    ports:
      - "8302:8302"
    environment:
      - BASE_API_URL_DEV=http://localhost:8301
      - BASE_API_URL_PROD=http://10.0.0.2:8301
      - LOG_LEVEL=INFO
      - ENVIRONMENT=dev
      - TZ=Europe/Paris
    command: uv run flet run --web --host 0.0.0.0 --port 8302
  

  reservationflet:
    build: reservationFlet/
    ports:
      - "8300:8000"
    environment:
      - LOG_LEVEL=INFO
      - ENVIRONMENT=prod
      - TZ=Europe/Paris
    working_dir: /app/src
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --interface asgi3 --ws auto --timeout-keep-alive 65 --ws-ping-interval 20
    
volumes:
  server_data: